version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moya_skazka_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: moya_skazka
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/prisma/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/0001_initial_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d moya_skazka']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: moya_skazka_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/moya_skazka?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MoyaSkazkaBot}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-chars-long}
      WELLFLOW_API_URL: ${WELLFLOW_API_URL:-https://api.wellflow.dev/v1}
      WELLFLOW_TEXT_KEY: ${WELLFLOW_TEXT_KEY}
      WELLFLOW_IMAGE_KEY: ${WELLFLOW_IMAGE_KEY}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-wellflow}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-wellflow}
      JOB_WORKER_TYPE: db
      JOB_POLL_INTERVAL_MS: 3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: moya_skazka_web
    restart: always
    depends_on:
      - api
    ports:
      - '80:80'
      - '5173:80'

volumes:
  pgdata:
    driver: local
