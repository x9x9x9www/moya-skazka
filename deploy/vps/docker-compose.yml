services:
  bot:
    build:
      context: ../..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.vps
    environment:
      NODE_ENV: production
      SKIP_TUNNELS: "true"
      DISABLE_PROXY: "true"
      WEB_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}/
      PUBLIC_BRIDGE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
    volumes:
      - bot_data:/app/bot/data
      - bot_generated:/app/bot/generated
    expose:
      - "4040"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.vps
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bot_data:
  bot_generated:
  caddy_data:
  caddy_config:
